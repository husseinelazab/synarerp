<div class="card"><h3>التغييرات المطلوبة</h3>
<p class="muted small">عند الاعتماد تُطبَّق القيم المطلوبة على <a href="{{ obj.beneficiary.get_absolute_url }}">ملف المستفيد</a>.</p>
<div class="table-wrap"><table class="table"><thead><tr><th>الحقل</th><th>القيمة الحالية</th><th>القيمة المطلوبة</th></tr></thead><tbody>
{% for label, old, new in obj.changes %}<tr><td>{{ label }}</td><td>{{ old|default:"—" }}</td><td><strong>{{ new }}</strong></td></tr>
{% empty %}<tr><td colspan="3" class="muted center">لا تختلف القيم المطلوبة عن الملف الحالي</td></tr>{% endfor %}</tbody></table></div></div>
