<table class="table"><thead><tr><th>التاريخ</th><th>النوع</th><th>الموضوع</th><th>بخصوص</th><th>المسؤول</th><th></th></tr></thead>
<tbody>{% for a in rows %}<tr><td>{{ a.date|date:"Y-m-d" }}</td><td>{{ a.get_kind_display }}</td><td><a href="{% url 'doc_detail' 'activity' a.pk %}">{{ a.summary }}</a></td>
  <td>{{ a.regarding|default:"" }}</td><td>{{ a.assigned_to|default:"" }}</td>
  <td>{% if not a.done %}<form method="post" action="{% url 'doc_action' 'activity' a.pk 'mark_done' %}">{% csrf_token %}<button class="btn btn-sm">تمت</button></form>{% endif %}</td></tr>
{% empty %}<tr><td colspan="6" class="muted center">لا شيء</td></tr>{% endfor %}</tbody></table>
