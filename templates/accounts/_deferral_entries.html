{% load erp %}{% if obj.entries.exists %}
<div class="card"><h3>جدول الأقساط</h3>
<table class="table"><thead><tr><th>التاريخ</th><th class="num">المبلغ</th><th>القيد</th></tr></thead>
<tbody>{% for e in obj.entries.all %}<tr><td>{{ e.posting_date|date:"Y-m-d" }}</td><td class="num">{{ e.amount|money }}</td>
<td>{% if e.journal_entry %}<a href="{{ e.journal_entry.get_absolute_url }}">{{ e.journal_entry }}</a>{% else %}<span class="muted">لم يُرحّل بعد</span>{% endif %}</td></tr>{% endfor %}</tbody></table></div>
{% endif %}
