<div class="card">
  <div class="card-head"><h3>صورة الغلاف</h3>{% if obj.is_published %}<span class="muted small">يظهر في المركز الإعلامي بالموقع</span>{% endif %}</div>
  {% if obj.cover %}<img src="{{ obj.cover }}" alt="" style="max-width:420px;width:100%;border-radius:10px;margin-bottom:10px">{% endif %}
  {% include "website/_image_upload.html" with kind="news" label="صورة الغلاف" current=obj.cover %}
</div>
