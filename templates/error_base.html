<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{% endblock %}</title>
{# صفحة مستقلة بلا سياق ولا ملفات خارجية: تعمل حتى لو تعطل جزء من النظام #}
<style>
  :root { --bg: #f4f6f8; --card: #fff; --ink: #1d2733; --muted: #5b6774; --accent: #1f5fa8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #12171d; --card: #1b222b; --ink: #e8edf2; --muted: #a3afbb; --accent: #6aa5ea; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font-family: Tahoma, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  main { background: var(--card); border-radius: 14px; padding: 32px; max-width: 460px; width: 100%; text-align: center;
         box-shadow: 0 2px 12px rgba(0,0,0,.06); }
  .code { font-size: 44px; font-weight: 700; color: var(--accent); margin: 0; }
  h1 { font-size: 20px; margin: 8px 0 12px; }
  p { color: var(--muted); line-height: 1.8; margin: 0 0 20px; }
  a { display: inline-block; background: var(--accent); color: #fff; text-decoration: none; padding: 10px 22px; border-radius: 8px; }
</style>
</head>
<body>
<main>
  <p class="code">{% block code %}{% endblock %}</p>
  <h1>{% block heading %}{% endblock %}</h1>
  <p>{% block message %}{% endblock %}</p>
  <a href="/">العودة للرئيسية</a>
</main>
</body>
</html>
