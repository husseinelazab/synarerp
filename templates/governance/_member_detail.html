{% load erp %}
<div class="card"><h3>الاشتراكات</h3><div class="table-wrap"><table class="table">
<thead><tr><th>السنة</th><th class="num">المبلغ</th><th class="num">المسدد</th><th>الحالة</th></tr></thead><tbody>
{% for f in obj.fees.all %}<tr><td><a href="{{ f.get_absolute_url }}">{{ f.year }}</a></td><td class="num">{{ f.amount|money }}</td><td class="num">{{ f.collected_amount|money }}</td><td>{{ f.get_status_display }}</td></tr>
{% empty %}<tr><td colspan="4" class="muted center">لا اشتراكات</td></tr>{% endfor %}</tbody></table></div></div>
