<div class="card">
  <div class="card-head"><h3>صورة الشريحة</h3>{% if obj.is_published %}<span class="muted small">تظهر في واجهة الصفحة الرئيسية بالموقع</span>{% endif %}</div>
  {% if obj.image %}<img src="{{ obj.image }}" alt="" style="max-width:420px;width:100%;border-radius:10px;margin-bottom:10px">{% endif %}
  {% include "website/_image_upload.html" with kind="slide" label="صورة الشريحة (يُفضّل بعرض 1600 بكسل)" current=obj.image %}
</div>
